name: Rick GGUF bundle

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Modèle Hugging Face"
        required: true
        default: "openai-community/gpt2-medium"
        type: choice
        options:
          - openai-community/gpt2
          - openai-community/gpt2-medium
          - openai-community/gpt2-large
          - openai-community/gpt2-xl
      quant:
        description: "Quantification"
        required: true
        default: "Q8_0"
        type: choice
        options: [Q8_0, Q5_K_M, Q4_K_M]

jobs:
  rick:
    runs-on: ubuntu-latest
    env:
      MODEL: ${{ inputs.model }}
      QUANT: ${{ inputs.quant }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cloner llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp

      - name: Corriger le bug du convertisseur GPT-2 (tenseurs attn.bias)
        run: |
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("llama.cpp/conversion/gpt2.py")
          lines = p.read_text().split("\n")
          done = False
          for i, l in enumerate(lines):
              if ".attn.masked_bias" in l and l.strip().startswith("if name.endswith"):
                  nxt = lines[i + 1]
                  if "yield from super().modify_tensors(data_torch, name, bid)" in nxt:
                      lines[i + 1] = nxt[: len(nxt) - len(nxt.lstrip())] + "return"
                      done = True
                  break
          p.write_text("\n".join(lines))
          print("patch applied" if done else "patch not needed")
          EOF

      - name: Dépendances (torch CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r llama.cpp/requirements/requirements-convert_hf_to_gguf.txt huggingface_hub

      - name: Compiler llama-quantize et llama-cli
        run: |
          cmake -S llama.cpp -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target llama-quantize llama-cli -j"$(nproc)"

      - name: Télécharger le modèle
        run: huggingface-cli download "$MODEL" --local-dir hf_model

      - name: Convertir en GGUF et quantifier
        run: |
          NAME=$(basename "$MODEL")
          python llama.cpp/convert_hf_to_gguf.py hf_model --outfile "$NAME-f16.gguf" --outtype f16
          ./build/bin/llama-quantize "$NAME-f16.gguf" "$NAME-$QUANT.gguf" "$QUANT"
          echo "GGUF=$NAME-$QUANT.gguf" >> "$GITHUB_ENV"

      - name: Test rapide avec le prompt Rick (non bloquant)
        continue-on-error: true
        run: |
          python -I -c "import sys; sys.path.insert(0,'src'); import rick_style as r; print(r.build_prompt([], 'Rick, are you drunk?'), end='')" > prompt.txt
          ./build/bin/llama-cli -m "$GGUF" -f prompt.txt -n 60 -no-cnv --temp 0.9 --top-k 40 < /dev/null

      - name: Assembler le pack Rick
        run: |
          mkdir -p rick/src
          cp "$GGUF" rick/
          cp src/rick_style.py src/rick_chat_gguf.py rick/src/
          printf '@echo off\r\npip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu\r\npython src\\rick_chat_gguf.py %s --drunk 0.8\r\npause\r\n' "$GGUF" > rick/rick.bat
          printf '#!/bin/sh\npip install llama-cpp-python\npython3 src/rick_chat_gguf.py %s --drunk 0.8\n' "$GGUF" > rick/rick.sh
          chmod +x rick/rick.sh
          cd rick && zip -r ../rick-gguf.zip .
          ls -lh ../rick-gguf.zip

      - uses: actions/upload-artifact@v4
        with:
          name: rick-gguf
          path: rick-gguf.zip
